name: Integrity audit

on:
  push:
    branches: [main, review/2026-09-27-integrity-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integrity-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  FL_NO_ORSLOT: '1'
  TZ: UTC

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # A migration regression reads an actual historical database module.
          fetch-depth: 0
      - name: Runtime versions
        run: |
          python3 --version
          node --version
      # Same tests as `python3 -m unittest discover -s server/tests`, dealt to four worker
      # processes (the runner has four cores). Failures print the module's full output.
      - name: Python server regression tests
        run: python3 server/tests/run_parallel.py -j 4 --durations 10
      - name: Collection provenance and benchmark regression tests
        if: always()
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Sidecar regression tests
        if: always()
        run: python3 -m unittest sidecar/test_laya.py sidecar/test_service.py -v
      - name: Extension regression tests across timezones
        if: always()
        run: |
          for tz in UTC Europe/Amsterdam America/New_York Pacific/Auckland; do
            echo "Testing TZ=$tz"
            TZ="$tz" node --test extension/test/*.test.mjs
          done
      - name: Web regression tests
        if: always()
        shell: bash
        run: |
          mapfile -d '' tests < <(find tests web -type f \( -name '*.test.mjs' -o -name '*.test.cjs' -o -name '*.test.js' \) -print0)
          test "${#tests[@]}" -gt 0
          node --test "${tests[@]}"

  # The eight-hour simulation takes about three minutes on its own. Running it beside the
  # regression job instead of after it makes it the only thing the pull request waits on.
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Runtime versions
        run: |
          python3 --version
          node --version
      - name: Collection interruption and recovery simulator
        run: node tests/e2e/driver.mjs
