<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 300" width="1040" height="300" role="img" aria-labelledby="t d"><title id="t">Where one page gap goes</title><desc id="d">Stacked bars for observed and proposed gap composition between list pages.</desc><rect width="1040" height="300" fill="#ffffff"/><text x="40.0" y="24.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Where one page gap goes (200-person following pages)</text><text x="40.0" y="42.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Seconds between two list requests. Observed medians in bold; the third bar is a model built from the same constants.</text><text x="200.0" y="92.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3 Oct run 1 (15 s poll)</text><rect x="210.0" y="70" width="113.3" height="34" fill="#6b7280"/><text x="266.7" y="91.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3.4</text><rect x="323.3" y="70" width="116.7" height="34" fill="#c4cdd8"/><text x="381.7" y="91.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3.5</text><rect x="440.0" y="70" width="500.0" height="34" fill="#b3261e"/><text x="690.0" y="91.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >15</text><text x="948.0" y="91.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >21.9 s observed</text><text x="200.0" y="150.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >4 Oct run (11.65 s poll, live patch)</text><rect x="210.0" y="128" width="113.3" height="34" fill="#6b7280"/><text x="266.7" y="149.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3.4</text><rect x="323.3" y="128" width="116.7" height="34" fill="#c4cdd8"/><text x="381.7" y="149.0" font-size="11" text-anchor="middle" fill="#1f2933" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3.5</text><rect x="440.0" y="128" width="388.3" height="34" fill="#d97b73"/><text x="634.2" y="149.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >11.65</text><text x="836.3" y="149.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >18.6 s observed</text><text x="200.0" y="208.0" font-size="11" text-anchor="end" fill="#1f2933" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Proposed: wait for the list clock</text><rect x="210.0" y="186" width="113.3" height="34" fill="#6b7280"/><text x="266.7" y="207.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3.4</text><rect x="323.3" y="186" width="316.7" height="34" fill="#3b5b8c"/><text x="481.7" y="207.0" font-size="11" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >9.5</text><text x="648.0" y="207.0" font-size