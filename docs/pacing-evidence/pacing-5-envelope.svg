xt><line x1="550.0" x2="550.0" y1="336" y2="366" stroke="#b3261e" stroke-width="2.5"/><text x="550.0" y="332.0" font-size="10" text-anchor="middle" fill="#b3261e" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >default 100</text><text x="700.0" y="380.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >ramp ceiling 150</text><text x="24.0" y="416.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Sample sizes: one day above 1,700, two days near 700 to 900, one 2-hour bio session at 69 an hour. The data does not show where Instagram starts to push back.</text></svg>