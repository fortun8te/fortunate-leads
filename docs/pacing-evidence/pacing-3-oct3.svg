<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 536" width="1040" height="536" role="img" aria-labelledby="t d"><title id="t">Where the 24 hours of 3 to 4 October went</title><desc id="d">Pages per ten minutes for @trashtheturtles with runs, stops and the reasons for each.</desc><rect width="1040" height="536" fill="#ffffff"/><text x="60.0" y="24.0" font-size="15" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >3 October to 4 October: where the 24 hours went (@trashtheturtles)</text><text x="60.0" y="42.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >List pages per 10 minutes. Window starts 12:00 UTC (14:00 Amsterdam) on 3 October.</text><line x1="60" x2="1016" y1="196.0" y2="196.0" stroke="#e5e7eb"/><text x="54.0" y="200.0" font-size="10" text-anchor="end" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >0</text><line x1="60" x2="1016" y1="156.0" y2="156.0" stroke="#e5e7eb"/><text x="54.0" y="160.0" font-size="10" text-anchor="end" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >20</text><line x1="60" x2="1016" y1="116.0" y2="116.0" stroke="#e5e7eb"/><text x="54.0" y="120.0" font-size="10" text-anchor="end" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >40</text><line x1="60" x2="1016" y1="76.0" y2="76.0" stroke="#e5e7eb"/><text x="54.0" y="80.0" font-size="10" text-anchor="end" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >60</text><rect x="66.6" y="180.0" width="5.8" height="16.0" fill="#2f8f83"/><rect x="73.3" y="152.0" width="5.8" height="44.0" fill="#2f8f83"/