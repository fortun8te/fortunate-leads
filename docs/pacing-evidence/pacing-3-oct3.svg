80" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >22</text><line x1="538.0" x2="538.0" y1="196" y2="200" stroke="#6b7280"/><text x="538.0" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >00</text><line x1="617.7" x2="617.7" y1="196" y2="200" stroke="#6b7280"/><text x="617.7" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >02</text><line x1="697.3" x2="697.3" y1="196" y2="200" stroke="#6b7280"/><text x="697.3" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >04</text><line x1="777.0" x2="777.0" y1="196" y2="200" stroke="#6b7280"/><text x="777.0" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >06</text><line x1="856.7" x2="856.7" y1="196" y2="200" stroke="#6b7280"/><text x="856.7" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >08</text><line x1="936.3" x2="936.3" y1="196" y2="200" stroke="#6b7280"/><text x="936.3" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >10</text><line x1="1016.0" x2="1016.0" y1="196" y2="200" stroke="#6b7280"/><text x="1016.0" y="212.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >12</text><text x="1016.0" y="226.0" font-size="10" text-anchor="end" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >UTC hour</text><rect x="60.0" y="240" width="9.3" height="26" fill="#d1d5db"/><rect x="69.3" y="240" width="104.9" height="26" fill="#2f8f83"/><text x="121.7" y="257.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >run 1</text><rect x="174.2" y="240" width="94.3" height="26" fill="#9ca3af"/><text x="221.3" y="257.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >budget reached</text><rect x="268.5" y="240" width="122.2" height="26" fill="#2f8f83"/><text x="329.5" y="257.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >run 2</text><rect x="390.6" y="240" width="190.5" height="26" fill="#9ca3af"/><text x="485.9" y="257.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >redirect pause</text><rect x="581.2" y="240" width="17.9" height="26" fill="#2f8f83"/><rect x="599.1" y="240" width="416.9" height="26" fill="#b3261e"/><text x="807.5" y="257.0" font-size="10" text-anchor="middle" fill="#fff" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >stopped: request not confirmed</text><text x="60.0" y="232.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >State of the account</text><text x="60.0" y="288.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Run 1, 12:14 to 14:52 (158 min)</text><text x="60.0" y="302.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >335 following pages of about 195 people, median gap 21.9 s. Stopped by the daily list budget (400, raised from 200 at 13:42): 2 + 335 pages + about 64 seed profile loads =</text><text x="60.0" y="315.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >401 counted requests.</text><text x="60.0" y="332.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Gap, 14:52 to 17:14 (142 min)</text><text x="60.0" y="346.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Self-imposed. The budget was spent. This account&#x27;s list budget reads 0 (unlimited) in the database now, so it was lifted before run 2.</text><text x="60.0" y="363.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Run 2, 17:14 to 20:18 (183 min)</text><text x="60.0" y="377.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >493 pages, almost all followers lists at about 24 people each (one fifth of the new people per request), median gap 19.1 s. Ends on a followers redirect to the home page</text><text x="60.0" y="390.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >at page 101 of one list.</text><text x="60.0" y="407.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Gap, 20:18 to 01:05 (287 min)</text><text x="60.0" y="421.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Self-imposed. A followers home redirect revokes the account selection and pauses both stages (server.py:924). The same list was retried at 22:22 after the 2 h route wait</text><text x="60.0" y="434.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >and redirected again. Collection was restarted by hand at 01:04:54.</text><text x="60.0" y="451.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Run 3, 01:05 to 01:32 (27 min)</text><text x="60.0" y="465.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >72 following pages, median gap 18.6 s with the 11.65 s poll patch.</text><text x="60.0" y="482.0" font-size="11" text-anchor="start" fill="#1f2933" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >Stop, 01:32 to the snapshot at 16:21 UTC</text><text x="60.0" y="496.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >No requests for 14 h 49 min. The last request had no confirmed end, so the server paused everything at 01:42 (accounts.py:1040). Cause unknown. Still paused at snapshot</text><text x="60.0" y="509.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" >time.</text></svg>